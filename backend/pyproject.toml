[project]
name = "syntime-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint.per-file-ignores]
"config/settings/dev.py" = ["F403"]
"config/settings/prod.py" = ["F403"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
# tests/ 不是包：以项目根为基址解析模块名，避免双重解析冲突
explicit_package_bases = true
mypy_path = "."

# celery 未提供 py.typed/类型桩，放行其缺失导入。
# 阿里云 V2.0 SDK（alibabacloud_*）受 Gate-P2a 约束、实测后方入依赖树，
# 其懒加载导入在 providers/base.py 内以定向 type: ignore 处理。
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["apps", "tests"]
python_files = ["test_*.py"]
