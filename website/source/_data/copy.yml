faq:
  heading: "常见问题"
  items:
    - q: "要花钱吗？"
      a: "免费。SynTime 是个人作品，按 Apache-2.0 发放，源码与镜像都免费，没有付费版本，也没有功能阉割。"
    - q: "数据安全吗？"
      a: "完全私有化：账单、资产、事件全部落在你自己的 PostgreSQL，不经任何第三方。云账号 AK/SK 以 AES-256-GCM 信封加密存储、主密钥不落代码，日志层自动脱敏；授予厂商的权限只需账单与资源的只读最小权限。"
    - q: "支持哪些云厂商？"
      a: "本期支持阿里云的账单与资产两条链路；厂商消息（事件推送）链路按决议顺延到二期。架构上已预留腾讯云、华为云、京东云、AWS 的适配位。"
    - q: "部署复杂吗？"
      a: "现在走源码部署：PostgreSQL + Redis，四个命令段落即可完成，另有演示数据命令可以立刻逛一遍所有页面。一条 `docker run` 拉起的形态仍在开发中。"
    - q: "为什么页面上到处是「开发中」和「二期」徽章？"
      a: "因为 ALPHA 阶段说真话比好看的卖点更有用。每个徽章都逐条对着代码定档，依据公开在设计稿的能力档位表里；已完成的部分可以直接跑，未完成的部分标清楚，不会让你点了才发现没有。"

