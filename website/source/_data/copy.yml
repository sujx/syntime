# 结构性增补（2026-11-16 批准）：首页由 9 段变 10 段，先给访客一块真的「已上线」。
# 四条均有代码证据，见设计稿 §3.5 表。
foundation:
  heading: "已经打实的地基"
  subheading: "这四条不是规划，是现在就能在你机器上跑起来的实现。"
  items:
    - title: "口径守恒的金额链路"
      body: "金额全链路 Decimal、不做浮点；预聚合按天整日重算后覆盖写，重复跑不产生重复金额，负数退款行照常参与，可与账单总额对平。"
      badge: shipped
    - title: "幂等到偏执"
      body: "账单、同步窗口、日聚合、资产、事件、厂商消息六条业务唯一键全部走唯一键兜底 + upsert，重复同步、重复扫描、并发触发都不脏数据。"
      badge: shipped
    - title: "凭据信封加密"
      body: "云账号 AK/SK 以 AES-256-GCM 加密，HKDF-SHA256 按密钥版本派生数据密钥，AAD 绑定账号与字段防密文挪用；主密钥不落代码，日志层自动脱敏。"
      badge: shipped
    - title: "财务角色字段级隔离"
      body: "财务人员看到的成本与事件数据中，实例 ID 等资源标识统一在序列化层置空——屏蔽只发生在一处，不会各页各漏一个。"
      badge: shipped

features:
  heading: "功能特性"
  subheading: "按 PRD 全貌呈现；徽章标出本期真正做到了哪一半。"
  cards:
    - id: settlement
      title: "项目财务汇算"
      body: "按项目标签自动归集 ECS / RDS / EIP / NAT / 域名费用，项目汇总一键下钻到实例账单，环比口径可追溯、可复算。"
      badge: partial
      badge_note: "汇算口径与三个查询接口（项目汇总 / 资源明细下钻 / 成本趋势）已上线并通过测试；「自动归集」所依赖的账单同步任务仍在开发中，当前可用演示数据或域名 CSV 导入先跑通。"
    - id: budget
      title: "预算与定期清单"
      body: "按账期月配置预算，超支整行高亮；月度 / 季度固定模板一键导出，每期提交财务的格式永远一致。"
      badge: partial
      badge_note: "预算表、超支比例计算、超支预警事件已上线；「一键导出固定模板清单」属本期未完成项，正在开发。"
    - id: asset
      title: "资产台账"
      body: "跨账号、跨地域的资源清单，域名也是一等公民：到期时间、注册商、DNS 服务器一目了然，T-30 / T-7 / T-1 自动预警。"
      badge: partial
      badge_note: "资产模型（含注册商 / 实名状态 / DNS / 到期时间 / 计费方式）、域名 CSV 批量导入与到期三档预警已上线；资产清单查询接口与资产自动同步待完成。"
    - id: events
      title: "事件中心"
      body: "欠费、停机、流量异常、续费成功统一留痕：厂商消息与平台自算双通道，未识别消息全程可见、不静默丢弃。"
      badge: partial
      badge_note: "事件列表、状态流转（含权限校验）与平台自算三类预警（域名即将到期 / 已过期 / 预算超支）已上线；厂商消息通道及欠费 / 停机 / 流量 / 续费四类事件按 Q20 决议顺延二期。"
    - id: governance
      title: "成本治理"
      body: "包年已停机、长期停机、EIP 未绑定、域名过期等疑似浪费清单化呈现，未分配成本占比治理目标 ≤ 5%。"
      badge: partial
      badge_note: "治理页的汇总 / 下钻 / 趋势视图已接线可用；闲置资源清单本身（后端仅有索引与状态变更字段，判定服务与接口尚未开发）为本期未完成项。"
    - id: export
      title: "异步报表导出"
      body: "大数据量后台异步生成，签名临时链接 24 小时有效，导出文件与页面数据同源一致。"
      badge: dev
      badge_note: "整卡能力待实现：异步任务数据模型已就位，导出链路、签名链接与文件生成尚未开发。"

