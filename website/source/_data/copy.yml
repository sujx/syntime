quickstart:
  heading: "快速开始"
  subheading: "现在是源码部署；一条命令拉起的形态在开发中。"
  # 设计稿 V1.0 此处写的是单条 docker run，实测该命令跑不通（全仓无 Dockerfile、
  # 无镜像，且单容器起不来 Celery worker/beat 与 Redis）。按真实可行的步骤改写。
  steps:
    - no: 1
      title: "准备依赖与环境"
      body: "PostgreSQL 15+（本项目在 17 上开发与实测）与 Redis 就绪；克隆仓库，用 uv 建 Python 3.12 虚拟环境并安装开发依赖。"
      # clone 命令由模板从 placeholders.github_url 拼装（Task 8），此处只列克隆之后的步骤。
      code: |
        cd SynTime/syntime/backend
        uv venv --python 3.12 && . .venv/bin/activate
        uv pip install -r requirements/dev.txt
    - no: 2
      title: "配置环境变量"
      body: "至少给 `SYNTIME_SECRET_KEY` 与数据库口令；AK/SK 加密主密钥可用 `SYNTIME_MASTER_KEY` 或密钥文件，DEBUG 下会自动生成开发用兜底密钥。"
      code: |
        # backend/.env（已 gitignore，勿提交）
        SYNTIME_SECRET_KEY=<自行生成>
        SYNTIME_DB_NAME=syntime_dev
        SYNTIME_DB_USER=syntime
        SYNTIME_DB_PASSWORD=<你的口令>
    - no: 3
      title: "建表、初始化角色与管理员"
      body: "15 张表由迁移建出；三角色 Group 幂等初始化；管理员自建。想先逛一遍可以灌演示数据。"
      code: |
        python manage.py migrate
        python manage.py init_roles
        python manage.py createsuperuser
        python manage.py seed_demo   # 可选：演示数据
    - no: 4
      title: "起 Web 与 Celery（三个进程）"
      body: "worker 与 beat 是两个独立进程，开发期请开三个终端。"
      code: |
        python manage.py runserver
        celery -A config worker -l info
        celery -A config beat -l info
  copy_hint: "复制上方命令"
  planned:
    title: "Docker 一条命令拉起"
    body: "镜像尚未发布；届时仍需 PostgreSQL 与 Redis 两个依赖服务，单一容器起不来 worker 与 beat，命令形态以发布说明为准。"
    badge: dev
  requirements: "环境要求：Python 3.12 · PostgreSQL 15+（开发实测环境 17）· Redis · 本期仅阿里云只读 AK/SK"

