# SynTime 宣传站文案单一来源（内容层）
#
# 规则（设计稿 §3 / §4）：所有面向访客的中文文案集中在此，模板只引用变量，
# 禁止在 EJS 里散落硬编码中文——日后抽英文字典仅换数据源，不动模板。
#
# 发布轴（2026-11-16 拍板）：**目标轴 + 显著 ALPHA 标注**。
# 卖点按 PRD 全貌写，但每个能力必须带状态徽章，徽章档位逐条对着代码定档，
# 依据与出处见 docs/宣传站设计方案_Hexo.md §3.5。不得按 PRD 愿望打 shipped。
#
# 状态四档 → design.md §5.7 pill 五态的映射（刻意与应用内「二期规划 = info」不同：
# 宣传页需同时区分四档，同色会让「开发中」与「二期」混为一谈）：
#   shipped → ok     partial → warn     dev → info     phase2 → mute
# 印章红 #C0392B 禁止进入徽章、按钮与强调文案（design.md §2 规则）。

meta:
  lang: zh-CN
  title: "SynTime · 与时偕行 —— 免费开源的私有化多云成本管理平台"
  description: "按项目标签归集云费用，预算、资产、事件、治理一站看清，部署在你自己的服务器上。"
  # og:image 用 1200×630 PNG（由仪表盘截图首屏生成）。**不用 WebP**：社交抓取器
  # （微信 / Twitter / Facebook）对 WebP 支持不稳，OG 惯例是 JPEG/PNG。
  og_image: "/images/og-image.png"

# ---------------------------------------------------------------------------
# 发布前必须与真实资源对齐的占位符（设计稿 §6「内容」验收项）
# TODO(发布前): 填 GitHub 组织/仓库名
# TODO(发布前): 填 DockerHub 命名空间/镜像名；镜像尚未发布，勿对外宣称可用
# TODO(发布前): syntime.cn 的 DNS 解析、实名认证与备案状态本轮未核实，落地前确认
# ---------------------------------------------------------------------------
placeholders:
  # 发布前需要改的 3 处：github_url / dockerhub_url / dockerhub_image（YAML 无法在标量里插值别名），
  # 其余引用全部经锚点共享；content.test.mjs 的 drift guard 会盯住这 3 处不一致。
  github_url: &gh_url "https://github.com/TODO_GITHUB_OWNER/SynTime"
  dockerhub_url: &dh_url "https://hub.docker.com/r/TODO_DOCKERHUB_NAMESPACE"
  github_repo: "TODO_GITHUB_OWNER/SynTime"
  dockerhub_namespace: "TODO_DOCKERHUB_NAMESPACE"
  dockerhub_image: "TODO_DOCKERHUB_NAMESPACE/syntime"
  docs_entry: "/docs/"
  changelog: "/updates/"

alpha_banner:
  text: "当前为 ALPHA 阶段：地基与查询链路可用，云厂商自动同步仍在开发中。页面每个能力都标注了真实状态。"
  badge: dev

labels:
  badges:
    shipped: "已上线"
    partial: "部分上线"
    dev: "开发中"
    phase2: "二期"
  badge_pill_state:
    shipped: ok
    partial: warn
    dev: info
    phase2: mute
  copy_button: "复制"
  copy_done: "已复制"
  # 横幅关闭按钮的可访问名（§2 段 1「右侧可关」）。按钮正文只有 &times; 字形，
  # 触屏无 hover 也不写 title —— 读屏与判据都只认这一个来源。
  close_banner: "关闭提示"
  # 文章页返回列表页的链接文案（T12 /updates/）。放这里而不是写进 post.ejs：
  # 约束 1 要求模板里不得有内容层之外的中文来源。只能挂在 labels 下——顶层键数被
  # tests/data.test.mjs 钉死（加一个就是假红）。
  post_back: "← 全部更新"
  # 跳锚链接（裁定 R-4）：Tab 第一击落进正文，读屏用户的快速入口。
  # 文案取能念的短语，不写「跳过导航」这类技术术语。
  skip_link: "跳到正文"

